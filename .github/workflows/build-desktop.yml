name: Build Desktop Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.os-name }} (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            target-name: .exe
            builder-args: --win
            release-files: release/*.exe
          - os: macos-latest
            os-name: macOS
            target-name: .dmg, .zip
            builder-args: --mac
            release-files: |
              release/*.dmg
              release/*.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web application
        run: bun run build

      - name: Package Desktop App
        run: npx electron-builder ${{ matrix.builder-args }} --config electron/builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Bảng Trắng Thông Minh ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ matrix.release-files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
